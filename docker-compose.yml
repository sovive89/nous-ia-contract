services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nous
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nous_contracts
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nous_contracts_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nous -d nous_contracts"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nous_contracts_pg:
